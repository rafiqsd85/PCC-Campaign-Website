
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign Poster | PCC Computer Club</title>

    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body class="min-h-screen bg-slate-100 text-blue-950">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center px-4 py-10">
      <h1 class="mb-2 text-center text-3xl font-bold">
        Campaign Poster
      </h1>

      <p class="mb-8 text-center text-slate-600">
        PCC Computer Club — Vice President Candidate
      </p>

      <!-- Poster Preview -->
      <img
        src="/poster.png"
        alt="Saidul Karim Ayas Campaign Poster"
        class="w-full max-w-md rounded-xl shadow-xl"
      />

      <!-- Download Button -->
      <a
        href="/poster.png"
        download="PCC-VP-AYAS-Poster.png"
        class="mt-6 inline-flex items-center justify-center gap-2 rounded-full border border-blue-950 px-7 py-3 font-semibold text-blue-950 transition hover:bg-blue-950 hover:text-white "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <path d="m7 10 5 5 5-5" />
          <path d="M12 15V3" />
        </svg>
        Download 
      </a>

      <!-- Back to Home -->
      <a
        href="/"
        class="mt-4 font-medium text-blue-800 underline hover:text-cyan-600"
      >
        ← Back to Home
      </a>
    </main>
  </body>
</html>
